name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            zipfile=$(ls *.zip | head -n1)
            mkdir -p _src
            unzip -o "$zipfile" -d _src
            dir=$(dirname "$(find _src -name package.json -not -path '*/node_modules/*' | head -n1)")
            cp -r "$dir"/. .
          fi
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Patch icon, orientation, fullscreen
        run: node scripts/patch-android.js

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastZone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
